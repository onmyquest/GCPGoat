kind: Deployment
metadata:
    labels:
        app.kubernetes.io/instance: release-name
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: usercount-usercount
        app.kubernetes.io/version: "1.0"
        helm.sh/chart: usercount-0.1.1
    name: release-name-usercount-usercount
spec:
    replicas: 1
    selector:
        matchLabels:
            app.kubernetes.io/instance: release-name
            app.kubernetes.io/name: usercount-usercount
    template:
        metadata:
            annotations:
                prometheus.io/port: "9100"
                prometheus.io/scrape: "true"
            creationTimestamp: null
            labels:
                app.kubernetes.io/instance: release-name
                app.kubernetes.io/name: usercount-usercount
        spec:
            containers:
                - image: docker.io/sysdiglabs/usercount:0.1
                  name: usercount
                  ports:
                    - containerPort: 9100
                      name: http
                      protocol: TCP
